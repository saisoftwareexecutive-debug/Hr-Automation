name: HireFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Security Guard, Unit Tests & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATA_STORAGE_MODE: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-temporary-placeholder-secret-at-least-32-chars-long
      AUTH_SECRET: ci-temporary-placeholder-secret-at-least-32-chars-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pre-Flight Security Guard
        run: npm run guard

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
